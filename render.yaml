# Despliegue gratuito en Render: web (Next.js) + API (NestJS) + Neon Postgres.
#
# Las imágenes subidas se guardan dentro de PostgreSQL, así que el API no
# necesita disco persistente y puede usar el plan free de Render.
#
# Cómo usarlo:
#   1. Crea un proyecto gratuito en Neon (https://neon.tech) y copia su
#      connection string (empieza por postgresql://...).
#   2. Sube este archivo a GitHub.
#   3. En Render: Dashboard > New > Blueprint > selecciona el repositorio.
#   4. Cuando Render pida ADMIN_PASSWORD y DATABASE_URL, escribe la contraseña
#      nueva del panel y la connection string de Neon.
#   5. Espera a que terminen los dos servicios y abre la URL de moodboard-web-*.
#
# Notas:
# - Los servicios free de Render se duermen tras unos minutos sin visitas. El
#   primer acceso puede tardar entre 30 y 60 segundos.
# - Neon free es permanente, sin tarjeta. Su plan free incluye 1 GB; suficiente
#   para las imágenes de este moodboard.
# - Los nombres de los servicios deben ser únicos en Render. Si Render les añade
#   un sufijo, actualiza API_INTERNAL_URL y WEB_ORIGIN con las URLs reales.

services:
  - type: web
    name: moodboard-api-valxci
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /api/content
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SYNC
        value: "true"
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://moodboard-web-valxci.onrender.com
      - key: PORT
        value: "10000"

  - type: web
    name: moodboard-web-valxci
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      # En Render, las variables se pasan también como build args al Dockerfile.
      # El Dockerfile las usa para hornear los rewrites de Next.
      - key: API_INTERNAL_URL
        value: https://moodboard-api-valxci.onrender.com
      - key: PORT
        value: "10000"
